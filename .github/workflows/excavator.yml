name: Excavator

# Keeps bucket/nanyx.json in step with the latest `compiler/<version>` release
# of nanyx-lang/nanyx. Scoop's checkver reads the version from the releases page,
# downloads the new zip, computes its hash and rewrites the manifest; this
# workflow installs and runs nanyx from that manifest, then commits the result.
#
# The install is checked here rather than left to the Test workflow because a
# push made with GITHUB_TOKEN does not trigger other workflows, so Test never
# sees these commits. Failing before the commit keeps a broken manifest out of
# the bucket.

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: excavator
  cancel-in-progress: false

jobs:
  excavate:
    runs-on: windows-latest
    steps:
      - name: Check out the bucket
        uses: actions/checkout@v4

      - name: Install Scoop
        shell: pwsh
        run: |
          Invoke-RestMethod -Uri https://get.scoop.sh -OutFile "$env:RUNNER_TEMP\install-scoop.ps1"
          & "$env:RUNNER_TEMP\install-scoop.ps1" -RunAsAdmin
          "$env:USERPROFILE\scoop\shims" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Check for new compiler releases
        shell: pwsh
        run: |
          $log = (.\bin\checkver.ps1 -Update *>&1 | Out-String)
          Write-Host $log
          # checkver reports problems (no match, download failure) without a
          # non-zero exit code, so fail the job ourselves.
          if ($log -match "couldn't match|ERROR") { exit 1 }

      # Runs whether or not checkver changed anything, so the daily run also
      # re-checks the manifest that is already published.
      - name: Install and run nanyx from the manifest
        shell: pwsh
        run: |
          scoop install "$env:GITHUB_WORKSPACE\bucket\nanyx.json"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          nanyx --help
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          scoop uninstall nanyx

      - name: Commit manifest updates
        shell: pwsh
        run: |
          $version = (Get-Content bucket/nanyx.json -Raw | ConvertFrom-Json).version
          git add bucket
          if (git diff --cached --quiet) {
            Write-Host 'No manifest changes.'
            "nanyx **$version** is already the latest version; no manifest changes." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            exit 0
          }
          "Updated nanyx to version **$version**." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "nanyx: Update to version $version"
          git push
